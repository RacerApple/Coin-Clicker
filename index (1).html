
<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a1a;
      font-family: Arial, sans-serif;
      color: white;
    }
    
    .game-container {
      text-align: center;
      padding: 20px;
    }
    
    .worlds {
      margin-bottom: 20px;
    }
    
    .world {
      padding: 10px 20px;
      margin: 0 10px;
      background: #333;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }
    
    .world.active {
      background: #4CAF50;
    }
    
    .earth-coin, .space-coin {
      width: 150px;
      height: 150px;
      margin: 20px auto;
      cursor: pointer;
      transition: transform 0.1s;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }
    
    .earth-coin {
      background-image: url('https://i.imgur.com/PQahunZ.png');
    }
    
    .space-coin {
      background-image: url('https://i.imgur.com/u6DpZSm.png');
    }
    
    @keyframes click {
      0% { transform: scale(1); }
      50% { transform: scale(0.95); }
      100% { transform: scale(1); }
    }
    
    .earth-diamond:active, .space-diamond:active {
      animation: click 0.1s;
    }
    
    button {
      background: #4CAF50;
      border: none;
      color: white;
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
      border-radius: 5px;
      font-size: 1rem;
    }
    
    button:disabled {
      background: #666;
      cursor: not-allowed;
    }
    
    .upgrades {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-end;
      position: fixed;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.8);
      padding: 20px;
      border-radius: 10px;
    }
    
    .achievements {
      position: fixed;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.8);
      padding: 20px;
      border-radius: 10px;
      max-height: 80vh;
      overflow-y: auto;
    }
    
    .achievement {
      background: #333;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      opacity: 0.5;
    }
    
    .achievement.unlocked {
      opacity: 1;
      background: #4CAF50;
    }
    
    .hidden {
      display: none;
    }
    
    .space-upgrade {
      display: none;
    }
    
    .space .space-upgrade {
      display: block;
    }
    
    #counter {
      font-size: 1.5rem;
      margin: 20px 0;
    }
    
    .upgrade {
      text-align: left;
      margin-top: 5px;
    }
    
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
      100% { transform: translateY(0px); }
    }
    
    @keyframes spin-slow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    
    .sprite {
      font-size: 1.5rem;
      display: inline-block;
    }
    
    #autoClickerSprites .sprite {
      animation: pulse 2s infinite;
    }
    
    #multiplierSprites .sprite {
      animation: spin-slow 3s linear infinite;
    }
    
    #mineSprites .sprite {
      animation: float 1.5s ease-in-out infinite;
    }
    
    #polisherSprites .sprite {
      animation: pulse 1s infinite;
    }
    
    #expertSprites .sprite {
      animation: float 2s ease-in-out infinite;
    }
    
    .hack-panel {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.8);
      padding: 20px;
      border-radius: 10px;
    }
    
    .hack-panel input {
      display: block;
      margin: 10px 0;
      padding: 5px;
      width: 200px;
    }
    
    .hack-panel button {
      display: block;
      width: 100%;
      margin: 5px 0;
      background: #ff0000;
    }
    
    .hack-panel button:hover {
      background: #cc0000;
    }
    
    .rebirth-btn {
      background: #9c27b0;
      margin-top: 1rem;
      font-size: 1.2rem;
      padding: 0.8rem 1.5rem;
    }
    
    .rebirth-btn:hover:not(:disabled) {
      background: #7b1fa2;
    }
  </style>
  <script>
    
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coin Clicker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <div class="worlds">
      <button id="earthWorld" class="world active">Earth</button>
      <button id="spaceWorld" class="world">Space (10,000 coins)</button>
    </div>
    <div id="cookie" class="earth-coin"></div>
    <div id="counter">Coins: <span id="count">0</span></div>
    <button id="toggleUpgrades">Show Upgrades</button>
    <button id="toggleAchievements">Show Achievements</button>
    <div class="upgrades hidden">
      <div class="upgrade">
        <button id="autoClickerBtn">Buy Auto Clicker (<span id="autoClickerCost">10</span>)</button>
        <div>Auto Clickers: <span id="autoClickerCount">0</span></div>
        <div id="autoClickerSprites" class="sprites"></div>
      </div>
      <div class="upgrade">
        <button id="multiplierBtn">Buy Multiplier (<span id="multiplierCost">50</span>)</button>
        <div>Multiplier: <span id="multiplierCount">1</span></div>
        <div id="multiplierSprites" class="sprites"></div>
      </div>
      <div class="upgrade">
        <button id="mineBtn">Buy Mine (<span id="mineCost">100</span>)</button>
        <div>Mines: <span id="mineCount">0</span></div>
        <div id="mineSprites" class="sprites"></div>
      </div>
      <div class="upgrade">
        <button id="polisherBtn">Buy Polisher (<span id="polisherCost">250</span>)</button>
        <div>Polishers: <span id="polisherCount">0</span></div>
        <div id="polisherSprites" class="sprites"></div>
      </div>
      <div class="upgrade">
        <button id="expertBtn">Hire Expert (<span id="expertCost">1000</span>)</button>
        <div>Experts: <span id="expertCount">0</span></div>
        <div id="expertSprites" class="sprites"></div>
      </div>
    </div>
    <div class="achievements hidden">
      <h2>Achievements</h2>
      <div id="achievementsList"></div>
    </div>
    <button id="rebirthBtn" class="rebirth-btn" disabled>Rebirth (Required: 1,000,000 coins)</button>
    <div class="hack-panel hidden">
      <h2>Hack Panel</h2>
      <input type="password" id="hackCode" placeholder="Enter secret code" maxlength="4">
      <div id="hackButtons" class="hidden">
        <button id="add1000">+1000 Diamonds</button>
        <button id="add10000">+10000 Diamonds</button>
        <button id="doubleMultiplier">2x Multiplier</button>
        <button id="max">Max Everything</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
